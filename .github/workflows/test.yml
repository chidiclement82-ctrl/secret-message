name: Test

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    # A stuck browser download on the runner shouldn't hold up deploys for hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # GitHub's Ubuntu runners come with Google Chrome; use it rather than
      # downloading a browser and its system packages, which has hung twice.
      - name: Use the runner's Chrome (download one only if it's missing)
        run: |
          if command -v google-chrome >/dev/null; then
            echo "CHROMIUM=$(command -v google-chrome)" >> "$GITHUB_ENV"
            google-chrome --version
          else
            npx playwright install --with-deps chromium
          fi
      - run: npm test
